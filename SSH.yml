name: Keep Servers serv00
permissions:
  contents: read

on:
  schedule:
   - cron: '0 15 */8 * *'
  workflow_dispatch: 

jobs:
  keep_servers_alive:
    runs-on: ubuntu-latest
    env:
      ACCOUNTS: ${{ secrets.SSH_ACCOUNTS_JSON }}
      KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass jq

      - name: Process each account
        run: |
           if [[ -z "${ACCOUNTS}" ]]; then
             echo "::error::Missing secret SSH_ACCOUNTS_JSON"
             exit 1
           fi

           SSH_OPTIONS=(-o StrictHostKeyChecking=accept-new)
           if [[ -n "${KNOWN_HOSTS}" ]]; then
             KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts"
             printf '%s\n' "${KNOWN_HOSTS}" > "$KNOWN_HOSTS_FILE"
             chmod 600 "$KNOWN_HOSTS_FILE"
             SSH_OPTIONS=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
           fi

           echo "*****************************************************"
           echo "*****************************************************"
           echo "甬哥Github项目  ：github.com/yonggekkk"
           echo "甬哥Blogger博客 ：ygkkk.blogspot.com"
           echo "甬哥YouTube频道 ：www.youtube.com/@ygkkk"
           echo "vps服务器远程登录一次SSH脚本【Github】"
           echo "*****************************************************"
           echo "*****************************************************"
            count=0  
           for account in $(echo "${ACCOUNTS}" | jq -c '.[]'); do
              count=$((count+1))
              SSH_USER=$(echo $account | jq -r '.SSH_USER')
              SSH_PASS=$(echo $account | jq -r '.SSH_PASS')
              HOST=$(echo $account | jq -r '.HOST')
              if [[ -z "$SSH_USER" || -z "$SSH_PASS" || -z "$HOST" ]]; then
                echo "::error::SSH_USER, SSH_PASS, HOST are required"
                exit 1
              fi
              if [[ ! "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ || ! "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
                echo "::error::Invalid SSH account format"
                exit 1
              fi
           if sshpass -p "$SSH_PASS" ssh "${SSH_OPTIONS[@]}" "$SSH_USER@$HOST" -q exit; then
            echo "🎉恭喜！✅第【$count】台服务器连接成功！🚀服务器地址：$HOST ，账户名：$SSH_USER" 
           else
            echo "===================================================="
            echo "💥杯具！❌第【$count】台服务器连接失败！🚀服务器地址：$HOST ，账户名：$SSH_USER"
            echo "⚠️可能账号名、密码、服务器名称输入错误，或者当前服务器在维护中"  
            echo "===================================================="
           fi
           sleep 10
            done
